if(p.t=="cover"){nb=1;h=`<div class="hero"><div class="ic">🧑‍🎓📱</div><div>💬 📧 🎥 🌐 🎙️ 👥 🔐</div><h1>💬 DIGITAL COMMUNICATION MISSION</h1><p><b>“Belajar Berkomunikasi di Dunia Digital dengan Cerdas, Santun, dan Bertanggung Jawab.”</b></p><p>Informatika SMP Kelas IX · Komunikasi Daring</p><button class="btn go" onclick="nx()">🚀 MULAI MISI</button></div>`}
else if(p.t=="id"){nb=1;h=`<h2>👤 Identitas Siswa</h2>Nama Siswa<input id="nm" value="${S.nm}"><br><br>Kelas<select id="kl">${["IX A","IX B","IX C","IX D","IX E"].map(k=>`<option ${S.kl==k?"selected":""}>${k}</option>`).join("")}</select><br><br>No. Absen<input id="ab" type="number" min="1" value="${S.ab}"><br><br><button class="btn go" onclick="start()">▶️ MASUK KE MISI</button>`}
else if(p.t=="info"){h=typeof p.h=="function"?p.h():p.h}
else if(p.t=="map"){nn=0;let all=S.done>=7;h=`<h2>🗺️ DIGITAL COMMUNICATION MAP</h2><div class="mp">${MS.map((n,k)=>`<button class="cd ms ${k<S.done?"dn":k>S.done?"lk":""}" ${k>S.done?"disabled":""} onclick="gm(${k+1})"><span>${k<S.done?"✅":k>S.done?"🔒":"🔓"}</span><div><b>Misi ${k+1}</b><br>${n}</div></button>`).join("")}</div><p>${bdg().join(" · ")||"Selesaikan misi untuk membuka badge!"}</p>${all?`<button class="btn go" onclick="go(P.findIndex(x=>x.t=='quiz'))">🏆 KE KUIS AKHIR</button>`:""}`}
else if(p.t=="q"){let r=p.c==p.a;h=(p.sec?`<span class="tg">${p.sec}</span>`:"")+(p.pre||"")+`<h3>${p.q}</h3>`+p.o.map((o,k)=>`<button class="op ${p.ok?k==p.a?"g":k==p.c?"r":"":""}" onclick="ans(${k})">${"ABCD"[k]}. ${o}</button>`).join("")+(p.ok?`<div class="fb ${r?"g":"r"}">${r?"✅ Benar!"+(p.pts?" +"+p.pts+" poin":""):"❌ Belum tepat."} ${p.f}</div>`:"");if(!p.ok)nn=0}
else if(p.t=="cards"){p.op=p.op||[];h=p.pre+`<div class="grid">${p.c.map((c,k)=>`<button class="cd ${p.op.includes(k)?"o":""}" onclick="cd(${k})"><span>${c[0]}</span><b>${c[1]}</b>${p.op.includes(k)?`<small>${c[2]}</small>`:""}</button>`).join("")}</div><small>${p.op.length}/${p.c.length} kartu dibuka</small>`;if(!p.ok)nn=0}
else if(p.t=="sort"){p.sel=p.sel||{};h=p.pre+p.items.map((x,i)=>`<div class="sr ${p.chk&&p.sel[i]!=x[1]?"x":""}"><span>${x[0]}${p.chk?p.sel[i]==x[1]?" ✅":" ❌":""}</span>${p.cats.map((c,k)=>`<button class="op ${p.sel[i]===k?"s":""}" onclick="pk(${i},${k})">${c}</button>`).join("")}</div>`).join("")+`<button class="btn go" onclick="ck()">Periksa Jawaban</button>`+(p.chk?`<div class="fb ${p.bad?"r":"g"}">${p.bad?"Masih "+p.bad+" yang kurang tepat. Ubah lalu periksa lagi!":"🎉 MISSION COMPLETE! +"+p.pts+" Poin"}</div>`:"");if(!p.ok)nn=0}
else if(p.t=="sim"){p.s=p.s||[-1,-1,-1];let G=[["Salam",["Halo","WOI","Kirim sekarang!"]],["Isi pesan",["Tolong kirim file tugasnya jika sudah selesai.","Kirim sekarang juga!","Mana tugasmu?!"]],["Penutup",["Terima kasih.","Cepat!","Udah."]]];h=`<span class="tg">✉️ Simulasi</span><h2>Kirim Pesan dengan Benar</h2><p>“Kamu ingin meminta file tugas kepada teman.” Susun pesanmu!</p>`+G.map((g,i)=>`<b>${g[0]}</b><div class="sr">${g[1].map((o,k)=>`<button class="op ${p.s[i]==k?"s":""}" onclick="sp(${i},${k})">${o}</button>`).join("")}</div>`).join("")+`<button class="btn go" onclick="sc()">Susun &amp; Kirim</button>`;if(!p.s.includes(-1)){let m=G.map((g,i)=>g[1][p.s[i]]);h+=B("Kamu",`${m[0].replace("!","")}, ${m[1][0].toLowerCase()+m[1].slice(1)} ${m[2]}`,1)}if(p.chk)h+=`<div class="fb ${p.ok?"g":"r"}">${p.ok?"🎉 Pesanmu sudah sopan dan efektif! +20 poin":"Masih ada bagian yang kurang sopan. Ubah pilihanmu!"}</div>`;if(!p.ok)nn=0}
else if(p.t=="write"){h=`<span class="tg">🏆 Tantangan 4</span><h3>Tulis pesan santun kepada grup untuk meluruskan masalah tadi.</h3><textarea id="w" rows="4" placeholder="Contoh: Halo teman-teman, yuk kita cek dulu infonya ke guru. Terima kasih.">${p.t2||""}</textarea><br><br><button class="btn go" onclick="wc()">Kirim Pesan</button>`+(p.chk?`<div class="fb ${p.ok?"g":"r"}">${p.ok?"🎉 Pesanmu santun dan jelas! +"+p.pts+" poin (Final Mission selesai)":"Gunakan kata santun (tolong, terima kasih, maaf), tanpa huruf kapital semua atau tanda seru berlebihan, minimal satu kalimat."}</div>`:"");if(!p.ok)nn=0}
else if(p.t=="quiz"){nb=1;let q=QZ[S.qi],a=S.qa[S.qi];h=`<div class="row"><span class="tg">🏆 Kuis Akhir ${S.qi+1}/15</span><span class="tg">${q.lv}</span></div><h3>${q.q}</h3>`+q.o.map((o,k)=>`<button class="op ${a===k?"s":""}" onclick="qa(${k})">${"ABCD"[k]}. ${o}</button>`).join("")+`<div class="row"><button class="btn" ${S.qi?"":"disabled"} onclick="qn(-1)">⬅</button>${S.qi<14?`<button class="btn go" onclick="qn(1)">➡</button>`:`<button class="btn go" ${S.qa.filter(x=>x!==undefined).length<15?"disabled":""} onclick="fin()">Selesai</button>`}</div><small>Jawaban benar atau salah ditampilkan di akhir.</small>`}
else if(p.t=="hasil"){let K=S.K,b=bdg();h=`<div class="hero"><h1>🎉 MISSION COMPLETE!</h1><p><b>${S.nm}</b> · ${S.kl} · Absen ${S.ab}</p><div class="big">${K.n}/100</div><p>✅ Benar ${K.b} · ❌ Salah ${K.s} · ${K.n}% · ⭐ ${S.pts} poin</p><h2>${b[b.length-1]||"🥉 Digital Explorer"}</h2><p>${b.join(" · ")}</p><p>“Hebat! Kamu sudah memahami cara berkomunikasi di dunia digital. Ingat, setiap pesan yang kita kirim dapat memberikan dampak kepada orang lain.”</p></div>`}
else if(p.t=="ref"){h=`<h2>🪞 Refleksi</h2>`+["Apa hal paling penting yang kamu pelajari?","Apakah kamu pernah salah paham saat chat?","Bagaimana cara menghindari salah paham?","Apa yang akan kamu lakukan sebelum menyebarkan informasi?","Bagaimana cara menjaga privasi saat berkomunikasi daring?"].map((q,i)=>`<p>${i+1}. ${q}<textarea rows="2"></textarea></p>`).join("")+`<b>Tingkat pemahamanmu:</b><div class="row">${[["😄","Sangat paham"],["🙂","Paham"],["😐","Cukup paham"],["😕","Masih perlu belajar"]].map(e=>`<button class="op ${S.em==e[0]?"s":""}" style="width:auto" onclick="em('${e[0]}')">${e[0]} ${e[1]}</button>`).join("")}</div>`;if(!p.ok)nn=0}
else if(p.t=="end"){nb=1;h=`<div class="hero"><h1>🌟 SELAMAT!</h1><p>“Kamu telah menyelesaikan Digital Communication Mission.”</p><h2>🏆 MASTER DIGITAL COMMUNICATOR</h2><p>“Teknologi membuat komunikasi menjadi lebih mudah. Namun, cara kita berkomunikasi menentukan apakah teknologi memberikan manfaat atau masalah.”</p><button class="btn go" onclick="location.reload()">🔄 ULANGI PEMBELAJARAN</button> <button class="btn" onclick="go(0)">🏠 MENU UTAMA</button></div>`}
v.innerHTML=h;$("#bar").innerHTML=nb?"":`<button class="btn" ${S.i?"":"disabled"} onclick="go(S.i-1)">⬅ Sebelumnya</button><button class="btn" onclick="go(0)">🏠 Menu</button><button class="btn" onclick="go(P.findIndex(x=>x.t=='map'&&P.indexOf(x)>3))">🗺️ Peta</button>${nn?`<button class="btn go" onclick="nx()">${p.nx||"Berikutnya ➡"}</button>`:`<button class="btn" disabled>Selesaikan dulu</button>`}`;
let pr=Math.round(S.i/(P.length-1)*100);$("#pg").style.width=pr+"%";$("#pc").textContent=pr+"%";$("#pt").textContent="⭐ "+S.pts}
R();
</script></body></html>
